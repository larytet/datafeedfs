# datafeedfs configuration. Relative paths for the parser command are relative to this file.

[remote]
# user@host that holds the pcap files; an empty string means the files are on the local machine.
ssh_host = "user@pcap-host.example.com"
# One pcap per trading day. {yyyy} {mm} {dd} are replaced; the same pattern, with wildcards, is used to discover the days.
pcap_path = "/data/pcaps/{yyyy}/{mm}/{dd}/nasdaq_itch.pcap.xz"

[parser]
# Run once per pass with the pcap (as stored) on stdin. See parsers/parse_nasdaq_itch.sh for the contract.
command = "parsers/parse_nasdaq_itch.sh"
# DFS_PORT restricts decoding to one UDP destination port (default: all ports in the pcap)
# env = { DFS_PORT = "12345" }

[cache]
dir = "~/.cache/datafeedfs"
# Cache cap with lazy LRU eviction (0 or absent = unlimited). Reads bump a file's mtime at most once an hour; every 10 minutes the
# cache is measured and, only when over max_gb, the least recently used files are deleted in small batches down to evict_to*max_gb.
# Files used in the last hour and empty-table markers are never evicted. Leave headroom on the disk: the cache can exceed the cap a little.
# max_gb = 80
# evict_to = 0.9
# scan_interval_seconds = 600
# touch_interval_seconds = 3600

[orderbook]
depth = 5                    # price levels per side in /orderbook (1 to 64); a different depth is a separate cache

[extract]
batch_window_seconds = 3.0   # requests for the same day inside this window share one pass over the pcap
max_parallel = 2             # passes over different days at once
on_miss = "block"            # "block" or "async" (open() fails with EAGAIN and extraction continues in the background)
whole_day = false            # true: a miss extracts every symbol of that day in one pass, so the pcap is read once per day (more disk, much less I/O)
