# Example config for the container. Mount your copy at /config/config.toml (see docker-compose.yml).

[remote]
ssh_host = "user@pcap-host.example.com"
pcap_path = "/data/pcaps/{yyyy}/{mm}/{dd}/nasdaq_itch.pcap.xz"
# the container has no interactive terminal: never prompt; new host keys are not accepted silently, mount a known_hosts file
ssh_options = ["-o", "BatchMode=yes", "-o", "ServerAliveInterval=30"]

[parser]
command = "/app/parsers/parse_nasdaq_itch.sh"
# DFS_PORT restricts decoding to one UDP destination port (default: all ports in the pcap)
# env = { DFS_PORT = "12345" }

[cache]
dir = "/cache"
# Cache cap with lazy LRU eviction (0 or absent = unlimited). Reads bump a file's mtime at most once an hour; every 10 minutes the
# cache is measured and, only when over max_gb, the least recently used files are deleted in small batches down to evict_to*max_gb.
# Files used in the last hour and empty-table markers are never evicted. Leave headroom on the disk: the cache can exceed the cap a little.
# max_gb = 80
# evict_to = 0.9
# scan_interval_seconds = 600
# touch_interval_seconds = 3600

[orderbook]
depth = 5                    # price levels per side in /orderbook (1 to 64); a different depth is a separate cache

[extract]
batch_window_seconds = 3.0
max_parallel = 2
on_miss = "block"
whole_day = true             # a miss extracts every symbol of that day in one pass: the pcap is read once per day (needs disk: ~0.5-3 GB per day)

# Web console (status, configuration, performance, load) on http://HOST:PORT. Off unless listen is set. See README, "Web console".
# [ui]
# listen = "127.0.0.1:8088"   # a non-loopback address requires a token
# allow_edit = false          # true: the console can save this file (whoever can save it can change parser.command)
# allow_restart = false       # true: a Restart now button stops the process so its supervisor restarts it with the saved config
# token = ""

# OpenTelemetry export (OTLP/HTTP): metrics and one trace per extraction pass. Off by default. See README, "OpenTelemetry".
# [telemetry]
# enabled = true
# endpoint = "http://otel-collector:4318"   # empty: OTEL_EXPORTER_OTLP_ENDPOINT or http://localhost:4318
# service_name = "datafeedfs"
# metrics_interval_seconds = 15
