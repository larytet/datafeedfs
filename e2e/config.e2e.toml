# datafeedfs config of the end-to-end test: the pcap host is the sshd container (see e2e/run.sh).
[remote]
ssh_host = "e2e@dfs-e2e-sshd"
pcap_path = "/data/pcaps/{yyyy}/{mm}/{dd}/nasdaq_tv.pcap.xz"
ssh_options = ["-o", "BatchMode=yes", "-o", "IdentitiesOnly=yes", "-i", "/root/.ssh/id_e2e", "-o", "UserKnownHostsFile=/root/.ssh/known_hosts", "-o", "StrictHostKeyChecking=yes"]

[parser]
command = "/app/parsers/parse_nasdaq_itch.sh"
env = { DFS_PORT = "26477" }

[cache]
dir = "/cache"
# a 10 MB cap with short intervals, so the eviction loop runs during the test
max_gb = 0.0093
scan_interval_seconds = 5
touch_interval_seconds = 1
# csv files stay: the cap test above counts on them (step 10 runs a second container with a short idle time)
csv_idle_seconds = -1

[orderbook]
depth = 5

[extract]
batch_window_seconds = 1.0
max_parallel = 2
on_miss = "block"
